services:
  mysql:
    image: mysql:8.4
    container_name: hotel-booking-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hotel_booking
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: hotel-booking-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
  app:
    build: .
    container_name: hotel-booking-app
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_started}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/hotel_booking?useSSL=false&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret-at-least-32-characters}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@hotel.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-production}
    ports: ["8080:8080"]
volumes:
  mysql_data:
  redis_data:
